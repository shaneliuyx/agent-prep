[project]
name = "lab-03-5-95-self-observability"
version = "0.1.0"
description = "W3.5.95 — self-observability memory: OBSERVABILITY + LEARNING + metacognitive recall over a minimal ReAct loop (and a smolagents integration demo)"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "smolagents>=1.0.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

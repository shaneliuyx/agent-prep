  <rect x="120" y="480" width="320" height="70" rx="8" ry="8" fill="#fff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="280.0" y="513.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Billing agent</text>
  <text x="280.0" y="528.0" text-anchor="middle" font-size="10" fill="#6b7280">tools: payment API · invoices · subscription</text>
  <rect x="480" y="480" width="320" height="70" rx="8" ry="8" fill="#fff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="640.0" y="513.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Tech agent</text>
  <text x="640.0" y="528.0" text-anchor="middle" font-size="10" fill="#6b7280">tools: error logs · known-issues DB · docs</text>
  <rect x="840" y="480" width="320" height="70" rx="8" ry="8" fill="#fff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1000.0" y="513.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Account agent</text>
  <text x="1000.0" y="528.0" text-anchor="middle" font-size="10" fill="#6b7280">tools: user profile · permissions · org mgmt</text>
  <line x1="1100" y1="400" x2="280" y2="480" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1100" y1="400" x2="640" y2="480" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1100" y1="400" x2="1000" y2="480" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="60" y="590" width="1160" height="200" rx="12" ry="12" fill="#faf5ff" stroke="#ddd6fe" stroke-width="2"/>

  <rect x="100" y="640" width="300" height="70" rx="8" ry="8" fill="#fff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="250.0" y="673.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Output validator</text>
  <text x="250.0" y="688.0" text-anchor="middle" font-size="10" fill="#6b7280">tone · PII scrub · policy check</text>
  <rect x="440" y="640" width="240" height="70" rx="8" ry="8" fill="#fff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="560.0" y="679.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Draft response</text>
  <polygon points="830.0,635 940,675.0 830.0,715 720,675.0" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="830.0" y="673.0" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Human review?</text>
  <rect x="980" y="640" width="200" height="70" rx="8" ry="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1080.0" y="679.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Send to customer</text>
  <line x1="280" y1="560" x2="250" y2="640" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="640" y1="560" x2="250" y2="640" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1000" y1="560" x2="250" y2="640" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="400" y1="675" x2="440" y2="675" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="680" y1="675" x2="720" y2="675" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="940" y1="675" x2="980" y2="675" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="950.0" y="667.0" width="20" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="960.0" y="678.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">No</text>
  <line x1="830" y1="715" x2="840" y2="380" stroke="#7f1d1d" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="822.0" y="539.5" width="26" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="835.0" y="550.5" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">Yes</text>
  <rect x="440" y="730" width="240" height="50" rx="8" ry="8" fill="#1a5276" stroke="#1a5276" stroke-width="1.5" filter="url(#ds)"/>
  <text x="560.0" y="753.0" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Edit log</text>
  <text x="560.0" y="768.0" text-anchor="middle" font-size="10" fill="#6b7280">edit distance → training signal</text>
  <line x1="840" y1="380" x2="560" y2="730" stroke="#7f1d1d" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="663.0" y="547.0" width="74" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="700.0" y="558.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">human edits</text>
  <rect x="60" y="820" width="1160" height="200" rx="12" ry="12" fill="#1b2631" stroke="#1b2631" stroke-width="2"/>
  <text x="78" y="844" font-size="13" font-weight="700" fill="#a5b4fc">Eval + monitoring</text>
  <rect x="100" y="880" width="320" height="70" rx="8" ry="8" fill="#374151" stroke="#6b7280" stroke-width="1.5" filter="url(#ds)"/>
  <text x="260.0" y="913.0" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Edit-distance metric</text>
  <text x="260.0" y="928.0" text-anchor="middle" font-size="10" fill="#6b7280">high = poor draft</text>
  <rect x="460" y="880" width="320" height="70" rx="8" ry="8" fill="#374151" stroke="#6b7280" stroke-width="1.5" filter="url(#ds)"/>
  <text x="620.0" y="913.0" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">CSAT score</text>
  <text x="620.0" y="928.0" text-anchor="middle" font-size="10" fill="#6b7280">linked to ticket_id</text>
  <rect x="820" y="880" width="320" height="70" rx="8" ry="8" fill="#374151" stroke="#6b7280" stroke-width="1.5" filter="url(#ds)"/>
  <text x="980.0" y="913.0" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">SLA breach monitor</text>
  <text x="980.0" y="928.0" text-anchor="middle" font-size="10" fill="#6b7280">→ escalation trigger</text>
  <line x1="560" y1="780" x2="260" y2="880" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1080" y1="710" x2="620" y2="880" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1050" y1="230" x2="980" y2="880" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="1002.0" y="547.0" width="26" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="1015.0" y="558.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">SLA</text>
</svg>
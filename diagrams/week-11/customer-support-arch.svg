<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" width="1280" height="1100">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }</style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/></marker>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7f1d1d"/></marker>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1280" height="1100" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">Customer Support Agent — Reference Architecture</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">5-stage system: Intake → Triage (escalate to human if low confidence) → Specialist agents → Output validation → Eval / SLA monitoring.</text>
  <rect x="60" y="100" width="1160" height="130" rx="12" ry="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="78" y="124" font-size="13" font-weight="700" fill="#1e3a8a">Intake — multi-channel normalization</text>
  <rect x="100" y="150" width="140" height="60" rx="8" ry="8" fill="#fff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="170.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Email</text>
  <rect x="260" y="150" width="140" height="60" rx="8" ry="8" fill="#fff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="330.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Chat</text>
  <rect x="420" y="150" width="140" height="60" rx="8" ry="8" fill="#fff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="490.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">In-app event</text>
  <rect x="600" y="150" width="240" height="60" rx="8" ry="8" fill="#fff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="720.0" y="178.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Ticket normalizer</text>
  <text x="720.0" y="193.0" text-anchor="middle" font-size="10" fill="#6b7280">body · channel · customer · tier · ts</text>
  <line x1="180" y1="180" x2="600" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="340" y1="180" x2="600" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="180" x2="600" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <ellipse cx="1050" cy="160" rx="70" ry="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="980" y="160" width="140" height="40" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
  <ellipse cx="1050" cy="200" rx="70" ry="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1050" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Postgres / Redis</text>
  <text x="1050" y="198" text-anchor="middle" font-size="9" fill="#6b7280">+ SLA clock</text>
  <line x1="840" y1="180" x2="980" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="60" y="260" width="1160" height="140" rx="12" ry="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="78" y="284" font-size="13" font-weight="700" fill="#9a3412">Triage — classifier agent</text>
  <rect x="100" y="310" width="280" height="70" rx="8" ry="8" fill="#fff" stroke="#fed7aa" stroke-width="1.5" filter="url(#ds)"/>
  <text x="240.0" y="343.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Intent classifier</text>
  <text x="240.0" y="358.0" text-anchor="middle" font-size="10" fill="#6b7280">small model — billing/tech/account/escalate</text>
  <polygon points="550.0,305 660,345.0 550.0,385 440,345.0" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="550.0" y="343.0" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Confidence ≥ thresh?</text>
  <rect x="720" y="310" width="240" height="70" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#ds)"/>
  <text x="840.0" y="343.0" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">Human queue</text>
  <text x="840.0" y="358.0" text-anchor="middle" font-size="10" fill="#6b7280">SLA-aware priority</text>
  <rect x="1000" y="310" width="200" height="70" rx="8" ry="8" fill="#fff" stroke="#fed7aa" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1100.0" y="349.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Router</text>
  <line x1="1050" y1="230" x2="240" y2="310" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="345" x2="440" y2="345" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="660" y1="345" x2="720" y2="345" stroke="#7f1d1d" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="647.0" y="337.0" width="86" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="690.0" y="348.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">No / escalate</text>
  <line x1="660" y1="345" x2="1000" y2="345" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="817.0" y="337.0" width="26" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="830.0" y="348.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">Yes</text>
  <rect x="60" y="430" width="1160" height="130" rx="12" ry="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>

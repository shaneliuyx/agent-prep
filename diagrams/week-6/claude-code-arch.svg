<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/></marker>
    <marker id="arr-flag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9a3412"/></marker>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="1280" height="900" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#111827">Claude Code — 98.4% Deterministic Infrastructure</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">7 deterministic subsystems wrap a single thin AI decision loop. Predictable, debuggable, auditable — the AI is the smallest part of the system.</text>
  <rect x="60" y="100" width="1160" height="660" rx="20" ry="20" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="84" y="132" font-size="15" font-weight="700" fill="#0c4a6e">DETERMINISTIC INFRASTRUCTURE  ·  98.4% of system</text>
  <rect x="105" y="165" width="280" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="133" cy="193" r="16" fill="#7dd3fc" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="133" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">②</text>
  <text x="161" y="197" font-size="13" font-weight="700" fill="#111827">PERMISSION SYSTEM</text>
  <text x="121" y="221" font-size="11" fill="#6b7280">7 modes + ML classifier</text>
  <text x="121" y="236" font-size="11" fill="#6b7280">code-layer gate</text>
  <rect x="495" y="165" width="280" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="523" cy="193" r="16" fill="#7dd3fc" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="523" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">③</text>
  <text x="551" y="197" font-size="13" font-weight="700" fill="#111827">COMPACTION PIPELINE</text>
  <text x="511" y="221" font-size="11" fill="#6b7280">5 layers: trim → dedup</text>
  <text x="511" y="236" font-size="11" fill="#6b7280">→ summarise → compress</text>
  <text x="511" y="251" font-size="11" fill="#6b7280">→ hard-truncate + sentinel</text>
  <rect x="885" y="165" width="280" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="913" cy="193" r="16" fill="#7dd3fc" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="913" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">④</text>
  <text x="941" y="197" font-size="13" font-weight="700" fill="#111827">TOOL ROUTER</text>
  <text x="901" y="221" font-size="11" fill="#6b7280">4 tracks: built-in │ MCP</text>
  <text x="901" y="236" font-size="11" fill="#6b7280">Task (subagent) │ skills/hooks</text>
  <rect x="290" y="320" width="700" height="220" rx="14" ry="14" fill="#1a1a2e" stroke="#6060cc" stroke-width="3" filter="url(#ds)"/>
  <text x="640.0" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">AI DECISION LOGIC  ·  ONLY 1.6% OF SYSTEM</text>
  <text x="640.0" y="378" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">THE AGENT LOOP</text>
  <text x="350" y="415" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e0e0ff">while not done:</text>
  <text x="350" y="433" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e0e0ff">    response = call_model(messages)</text>
  <text x="350" y="451" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e0e0ff">    if tool_calls:</text>
  <text x="350" y="469" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e0e0ff">        dispatch → router → permission_gate</text>
  <text x="350" y="487" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e0e0ff">    if text:</text>
  <text x="350" y="505" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e0e0ff">        emit; check_stop()</text>
  <text x="350" y="523" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e0e0ff">    messages = maybe_compact(messages)</text>
  <rect x="105" y="580" width="280" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="133" cy="608" r="16" fill="#7dd3fc" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="133" y="613" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">⑤</text>
  <text x="161" y="612" font-size="13" font-weight="700" fill="#111827">SUBAGENT DISPATCH</text>
  <text x="121" y="636" font-size="11" fill="#6b7280">Task tool → isolated child</text>
  <text x="121" y="651" font-size="11" fill="#6b7280">own context + permission scope</text>
  <rect x="495" y="580" width="280" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="523" cy="608" r="16" fill="#7dd3fc" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="523" y="613" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">⑥</text>
  <text x="551" y="612" font-size="13" font-weight="700" fill="#111827">SESSION STORAGE</text>
  <text x="511" y="636" font-size="11" fill="#6b7280">append-only event log</text>
  <text x="511" y="651" font-size="11" fill="#6b7280">event sourcing verbatim</text>
  <rect x="885" y="580" width="280" height="100" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="913" cy="608" r="16" fill="#7dd3fc" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="913" y="613" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">⑦</text>
  <text x="941" y="612" font-size="13" font-weight="700" fill="#111827">HOOK SYSTEM</text>
  <text x="901" y="636" font-size="11" fill="#6b7280">PreToolUse · PostToolUse · Stop</text>
  <text x="901" y="651" font-size="11" fill="#6b7280">OS-process isolation</text>
  <rect x="460" y="790" width="360" height="80" rx="10" ry="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="476" y="812" font-size="11" font-weight="700" fill="#9a3412">FEATURE-FLAGGED · OFF BY DEFAULT</text>
  <circle cx="488" cy="840" r="14" fill="#fed7aa" stroke="#fed7aa"/>
  <text x="488" y="844" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">⑧</text>
  <text x="510" y="840" font-size="13" font-weight="700" fill="#111827">PROACTIVE / KAIROS</text>
  <text x="510" y="856" font-size="11" fill="#6b7280">background monitoring · autonomous trigger + scheduler</text>
  <line x1="245" y1="265" x2="370" y2="318" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="291.1" y="282.5" width="32.8" height="14" fill="#f0f9ff" opacity="0.95"/>
  <text x="307.5" y="293.5" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">gate</text>
  <line x1="635" y1="265" x2="640.0" y2="318" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="611.8" y="282.5" width="51.4" height="14" fill="#f0f9ff" opacity="0.95"/>
  <text x="637.5" y="293.5" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">compact</text>
  <line x1="1025" y1="265" x2="910" y2="318" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="938.7" y="282.5" width="57.6" height="14" fill="#f0f9ff" opacity="0.95"/>
  <text x="967.5" y="293.5" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">dispatch</text>
  <line x1="370" y1="540" x2="245" y2="578" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="272.5" y="550.0" width="70.0" height="14" fill="#f0f9ff" opacity="0.95"/>
  <text x="307.5" y="561.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">spawn Task</text>
  <line x1="640.0" y1="540" x2="635" y2="578" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="596.3" y="550.0" width="82.4" height="14" fill="#f0f9ff" opacity="0.95"/>
  <text x="637.5" y="561.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">append event</text>
  <line x1="910" y1="540" x2="1025" y2="578" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="910.8" y="550.0" width="113.4" height="14" fill="#f0f9ff" opacity="0.95"/>
  <text x="967.5" y="561.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">fire on lifecycle</text>
  <line x1="640.0" y1="790" x2="640.0" y2="544" stroke="#9a3412" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr-flag)"/>
  <rect x="564.7" y="658.0" width="150.6" height="14" fill="#f0f9ff" opacity="0.95"/>
  <text x="640.0" y="669.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">initiates session (off)</text>
</svg>
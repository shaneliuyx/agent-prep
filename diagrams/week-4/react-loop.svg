  <rect x="446.7" y="432.5" width="26.6" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="460.0" y="443.5" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">yes</text>
  <line x1="340" y1="495" x2="310" y2="495" stroke="#7f1d1d" stroke-width="1.6" marker-end="url(#arr-err)"/>
  <rect x="296.2" y="486.0" width="57.6" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="325.0" y="497.0" text-anchor="middle" font-size="11" font-style="italic" fill="#7f1d1d">exceeded</text>
  <line x1="460" y1="530" x2="460" y2="568" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr-ctrl)"/>
  <rect x="449.8" y="540.0" width="20.4" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="460.0" y="551.0" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">OK</text>
  <line x1="460" y1="640" x2="460" y2="678" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr-ctrl)"/>
  <line x1="310" y1="520" x2="320" y2="710" stroke="#7f1d1d" stroke-width="1.6" marker-end="url(#arr-err)"/>
  <line x1="460" y1="740" x2="460" y2="768" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr-ctrl)"/>
  <line x1="340" y1="805" x2="310" y2="805" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr-ctrl)"/>
  <rect x="311.7" y="796.0" width="26.6" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="325.0" y="807.0" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">yes</text>
  <line x1="460" y1="840" x2="460" y2="868" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr-ctrl)"/>
  <rect x="449.8" y="845.0" width="20.4" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="460.0" y="856.0" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">no</text>
  <line x1="310" y1="830" x2="330" y2="905" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr-ctrl)"/>
  <line x1="340" y1="905" x2="310" y2="905" stroke="#7f1d1d" stroke-width="1.6" marker-end="url(#arr-err)"/>
  <rect x="311.7" y="896.0" width="26.6" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="325.0" y="907.0" text-anchor="middle" font-size="11" font-style="italic" fill="#7f1d1d">yes</text>
  <path d="M 580 905 L 800 905 L 800 205 L 600 205" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#arr-ctrl)"/>
  <text x="800" y="900" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">no — loop</text>
  <path d="M 600 605 C 760 605, 800 480, 880 480" stroke="#1f2937" stroke-width="1.6" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-ctrl)"/>
  <path d="M 840 905 C 870 905, 870 810, 980 810" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-obj)"/>
  <text x="845" y="750" font-size="10" font-style="italic" fill="#6b7280" text-anchor="end">log every iter</text>
  <circle cx="200" cy="470" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="200" cy="470" r="7" fill="#1f2937"/>
  <line x1="200" y1="422" x2="200" y2="456" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr-ctrl)"/>
  <circle cx="200" cy="970" r="14" fill="#ffffff" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="200" cy="970" r="7" fill="#7f1d1d"/>
  <line x1="200" y1="930" x2="200" y2="956" stroke="#7f1d1d" stroke-width="1.6" marker-end="url(#arr-err)"/>
  <text x="40" y="1030" font-size="11" font-weight="600" fill="#6b7280">UML NOTATION</text>
  <text x="40" y="1048" font-size="11" fill="#111827">●  initial   ◇  decision (with [guard])   ◉  final   solid arrow = control   dashed = log/observability   red arrow = error path</text>
  <text x="40" y="1066" font-size="11" font-style="italic" fill="#6b7280">Blue subgraph = ReAct Loop · Green = Tool Layer · Purple = Observability Sidecar</text>
</svg>
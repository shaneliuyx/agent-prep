<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" width="1280" height="1100">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
  <defs>
    <marker id="arr-ctrl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/>
    </marker>
    <marker id="arr-obj" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
    <marker id="arr-err" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f1d1d"/>
    </marker>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1280" height="1100" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">Week 4 — ReAct Loop (agent_run)</text>
  <text x="40" y="62" font-size="12" fill="#6b7280">User → assemble → call LLM → (budget + circular guard) → dispatch tool → record → context-evict → iter-check → loop. Side: tools layer + SQLite observability sidecar.</text>
  <rect x="80" y="100" width="760" height="820" rx="14" ry="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="98" y="124" font-size="13" font-weight="700" fill="#111827">ReAct Loop — agent_run()</text>
  <circle cx="460" cy="145" r="8" fill="#1f2937"/>
  <text x="474" y="149" font-size="11" font-style="italic" fill="#6b7280">user message</text>
  <rect x="320.0" y="175" width="280" height="60" rx="30.0" ry="30.0" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="460" y="203.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">context_for_llm()</text>
  <text x="460" y="219.0" text-anchor="middle" font-size="11" fill="#6b7280">system + tools + user + scratchpad</text>
  <rect x="320.0" y="270" width="280" height="60" rx="30.0" ry="30.0" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" filter="url(#ds)"/>
  <text x="460" y="298.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">call_llm()</text>
  <text x="460" y="314.0" text-anchor="middle" font-size="11" fill="#6b7280">oMLX :8000 · Qwen3.6-35B-A3B-nvfp4</text>
  <polygon points="460,365 560.0,395.0 460,425 360.0,395.0" fill="#ffffff" stroke="#1f4068" stroke-width="1.5" filter="url(#ds)"/>
  <text x="460" y="392.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">tool_calls?</text>
  <rect x="90.0" y="372" width="220" height="50" rx="25.0" ry="25.0" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#ds)"/>
  <text x="200" y="402.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Return final answer</text>
  <polygon points="460,460 580.0,495.0 460,530 340.0,495.0" fill="#ffffff" stroke="#1f4068" stroke-width="1.5" filter="url(#ds)"/>
  <text x="460" y="492.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">budget OK?</text>
  <text x="460" y="509.0" text-anchor="middle" font-size="10" fill="#6b7280">circular args?</text>
  <rect x="90.0" y="470" width="220" height="50" rx="25.0" ry="25.0" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#ds)"/>
  <text x="200" y="493.0" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Return error to scratchpad</text>
  <text x="200" y="509.0" text-anchor="middle" font-size="11" fill="#6b7280">circuit breaker</text>
  <rect x="320.0" y="570" width="280" height="70" rx="35.0" ry="35.0" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="460" y="603.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">run_tool()</text>
  <text x="460" y="619.0" text-anchor="middle" font-size="11" fill="#6b7280">resolve name → call · catch all</text>
  <rect x="320.0" y="680" width="280" height="60" rx="30.0" ry="30.0" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="460" y="708.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Append to Scratchpad</text>
  <text x="460" y="724.0" text-anchor="middle" font-size="11" fill="#6b7280">(append-only event log)</text>
  <polygon points="460,770 580.0,805.0 460,840 340.0,805.0" fill="#ffffff" stroke="#1f4068" stroke-width="1.5" filter="url(#ds)"/>
  <text x="460" y="802.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">tokens > LIMIT?</text>
  <rect x="90.0" y="780" width="220" height="50" rx="25.0" ry="25.0" fill="#fef3c7" stroke="#facc15" stroke-width="1.5" filter="url(#ds)"/>
  <text x="200" y="803.0" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">Drop oldest entry</text>
  <text x="200" y="819.0" text-anchor="middle" font-size="11" fill="#6b7280">tiered eviction (FIFO)</text>
  <polygon points="460,870 580.0,905.0 460,940 340.0,905.0" fill="#ffffff" stroke="#1f4068" stroke-width="1.5" filter="url(#ds)"/>
  <text x="460" y="902.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">iter ≥ MAX_ITER?</text>
  <rect x="90.0" y="880" width="220" height="50" rx="25.0" ry="25.0" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#ds)"/>
  <text x="200" y="903.0" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Return DLQ message</text>
  <text x="200" y="919.0" text-anchor="middle" font-size="11" fill="#6b7280">AGENT STOPPED</text>
  <rect x="880" y="380" width="360" height="290" rx="14" ry="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="898" y="404" font-size="13" font-weight="700" fill="#14532d">Tool Layer — src/tools.py</text>

  <text x="970" y="458.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">web_search</text>
  <text x="970" y="474.0" text-anchor="middle" font-size="11" fill="#6b7280">DDGS · max=4</text>
  <rect x="1070.0" y="430" width="160" height="60" rx="30.0" ry="30.0" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1150" y="458.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">python_repl</text>
  <text x="1150" y="474.0" text-anchor="middle" font-size="11" fill="#6b7280">subprocess · max=6</text>
  <rect x="890.0" y="550" width="160" height="60" rx="30.0" ry="30.0" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="970" y="578.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">read_file</text>
  <text x="970" y="594.0" text-anchor="middle" font-size="11" fill="#6b7280">path-contained · 8</text>
  <rect x="1070.0" y="550" width="160" height="60" rx="30.0" ry="30.0" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1150" y="578.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">write_file</text>
  <text x="1150" y="594.0" text-anchor="middle" font-size="11" fill="#6b7280">path-contained · 4</text>
  <rect x="880" y="720" width="360" height="200" rx="14" ry="14" fill="#faf5ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="898" y="744" font-size="13" font-weight="700" fill="#5b21b6">Observability Sidecar — src/obs.py</text>
  <rect x="880.0" y="780" width="200" height="60" rx="30.0" ry="30.0" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="980" y="808.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">log_event()</text>
  <text x="980" y="824.0" text-anchor="middle" font-size="11" fill="#6b7280">row per iteration</text>
  <ellipse cx="1120" cy="850" rx="60" ry="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="1060" y="850" width="120" height="40" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <ellipse cx="1120" cy="890" rx="60" ry="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="1120" y="872" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">SQLite</text>
  <text x="1120" y="888" text-anchor="middle" font-size="10" fill="#6b7280">agent_events</text>

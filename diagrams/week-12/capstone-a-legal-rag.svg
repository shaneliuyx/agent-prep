<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }</style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7f1d1d"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/></marker>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1280" height="880" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">Capstone A — Legal RAG Architecture</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">Lawyer/analyst query → Router → ACL filter → Qdrant (per-tenant) → Reranker → Refusal gate or Synthesis with citations. Audit + RAGAS eval as side flows.</text>
  <rect x="60" y="130" width="180" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="150.0" y="168.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">👤 User</text>
  <text x="150.0" y="184.0" text-anchor="middle" font-size="11" fill="#6b7280">lawyer / analyst</text>
  <rect x="280" y="130" width="200" height="80" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#ds)"/>
  <text x="380.0" y="168.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Query Router</text>
  <text x="380.0" y="184.0" text-anchor="middle" font-size="11" fill="#6b7280">intent classifier</text>
  <rect x="520" y="130" width="200" height="80" rx="8" ry="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#ds)"/>
  <text x="620.0" y="168.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ACL Gate</text>
  <text x="620.0" y="184.0" text-anchor="middle" font-size="11" fill="#6b7280">tenant_id filter</text>
  <text x="620.0" y="196.0" text-anchor="middle" font-size="11" fill="#6b7280">pre-retrieval</text>
  <ellipse cx="860.0" cy="130" rx="100.0" ry="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="760" y="130" width="200" height="80" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <ellipse cx="860.0" cy="210" rx="100.0" ry="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="860.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Qdrant</text>
  <text x="860.0" y="194.0" text-anchor="middle" font-size="10" fill="#6b7280">per-tenant collections</text>
  <text x="860.0" y="206.0" text-anchor="middle" font-size="10" fill="#6b7280">BGE-M3 embeddings</text>
  <rect x="1000" y="130" width="220" height="80" rx="8" ry="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1110.0" y="168.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">BGE-reranker-v2-m3</text>
  <text x="1110.0" y="184.0" text-anchor="middle" font-size="11" fill="#6b7280">cross-encoder rerank</text>
  <line x1="240" y1="170" x2="280" y2="170" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="170" x2="520" y2="170" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="720" y1="170" x2="760" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="712.0" y="167.0" width="56" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="740.0" y="178.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">filtered</text>
  <line x1="960" y1="180" x2="1000" y2="170" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="958.0" y="167.0" width="44" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="980.0" y="178.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">top-50</text>
  <rect x="490" y="290" width="240" height="100" rx="8" ry="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#ds)"/>
  <text x="610.0" y="338.0" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Refusal Layer</text>
  <text x="610.0" y="354.0" text-anchor="middle" font-size="11" fill="#7f1d1d">out-of-scope detector</text>
  <line x1="1110" y1="210" x2="730" y2="340" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="901.0" y="267.0" width="38" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="920.0" y="278.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">top-5</text>
  <rect x="490" y="450" width="280" height="90" rx="8" ry="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="630.0" y="493.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Gemma-4-26B Synthesis</text>
  <text x="630.0" y="509.0" text-anchor="middle" font-size="11" fill="#6b7280">+ citation</text>
  <text x="630.0" y="521.0" text-anchor="middle" font-size="11" fill="#6b7280">(sonnet tier)</text>
  <line x1="610" y1="390" x2="610" y2="450" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="564.0" y="412.0" width="92" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="610.0" y="423.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">in-scope: pass</text>
  <rect x="420" y="600" width="360" height="80" rx="8" ry="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" filter="url(#ds)"/>
  <text x="600.0" y="645.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Cited Answer + source spans</text>
  <line x1="630" y1="540" x2="600" y2="600" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="340" x2="420" y2="630" stroke="#7f1d1d" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="394.0" y="477.0" width="122" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="455.0" y="488.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">out-of-scope: block</text>
  <rect x="880" y="430" width="280" height="60" rx="8" ry="8" fill="#1a5276" stroke="#1a5276" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1020.0" y="458.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Audit Log</text>
  <text x="1020.0" y="474.0" text-anchor="middle" font-size="11" fill="#ffffff">SQLite append-only · who/what/when</text>
  <rect x="880" y="510" width="280" height="60" rx="8" ry="8" fill="#1a5276" stroke="#1a5276" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1020.0" y="538.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Phoenix Traces</text>
  <text x="1020.0" y="554.0" text-anchor="middle" font-size="11" fill="#ffffff">span per retrieval + synthesis</text>
  <rect x="880" y="590" width="280" height="80" rx="8" ry="8" fill="#374151" stroke="#6b7280" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1020.0" y="628.0" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">RAGAS Eval (offline)</text>
  <text x="1020.0" y="644.0" text-anchor="middle" font-size="11" fill="#ffffff">faithfulness · context-precision</text>
  <text x="1020.0" y="656.0" text-anchor="middle" font-size="11" fill="#ffffff">answer-relevancy</text>
  <line x1="770" y1="480" x2="880" y2="460" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ag)"/>
  <rect x="806.0" y="462.0" width="38" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="825.0" y="473.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">audit</text>
  <line x1="770" y1="510" x2="880" y2="540" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ag)"/>
  <rect x="806.0" y="517.0" width="38" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="825.0" y="528.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">trace</text>
  <line x1="1020" y1="670" x2="870" y2="220" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ag)"/>
  <rect x="905.0" y="437.0" width="80" height="14" fill="#ffffff" opacity="0.95"/>
  <text x="945.0" y="448.0" text-anchor="middle" font-size="10" font-style="italic" fill="#6b7280">offline eval</text>
</svg>
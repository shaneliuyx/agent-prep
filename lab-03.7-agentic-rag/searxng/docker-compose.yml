# Local SearXNG metasearch — the free, no-key web-fallback backend for §3.3.
#
#   Start:  docker compose -f searxng/docker-compose.yml up -d
#   Use:    export SEARXNG_URL=http://localhost:8080   # web_search() prefers it over Tavily/DDG
#   Stop:   docker compose -f searxng/docker-compose.yml down
#
# Why a metasearch and not just Tavily/DuckDuckGo: for some atomic figures (the BHE 2023
# revenue case) both Tavily and DDG rank a PAYWALLED Statista snippet ("**** billion")
# above the free Wikipedia figure (US$26.198B). SearXNG aggregates Google + Startpage and
# reranks, floating the readable source into the top results so synthesize() can cite a real
# number instead of abstaining. Full diagnosis: the "Web-Fallback Decomposition" debug log
# in the curriculum vault.
services:
  searxng:
    image: searxng/searxng
    container_name: searxng-lab
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

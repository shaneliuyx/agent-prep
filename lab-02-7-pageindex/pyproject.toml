[project]
name = "lab02-7-pageindex"
version = "0.1.0"
description = "Week 2.7 Structure-Aware RAG (PageIndex / tree-index) lab"
requires-python = ">=3.11"

dependencies = [
  # Tree-index core (Phase 2 / 3)
  "pypdf",
  "openai",
  "python-dotenv",
  "tqdm",
  # Phase 4 three-way comparison — vector backend (shared/rag_hybrid)
  "qdrant-client",
  "sentence-transformers",
  "FlagEmbedding",
  # Phase 4 — graph backend (W2.5 GraphRAG via env-var parameterization)
  "neo4j",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

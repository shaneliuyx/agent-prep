[project]
name = "lab03-rag-eval"
version = "0.1.0"
description = "Week 3 RAG evaluation lab"
requires-python = ">=3.11"

dependencies = [
  "ragas",
  "langchain",
  "langchain-openai",
  "langchain-huggingface",
  "qdrant-client",
  "sentence-transformers",
  "openai",
  "datasets",
  "protobuf>=5.29.4,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]